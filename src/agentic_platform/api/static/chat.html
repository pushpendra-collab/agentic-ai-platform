<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Agent Chat (Test)</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1d2330; --muted: #677085; --line: #dfe3ea;
    --accent: #2f5bd3; --accent-text: #ffffff; --user: #e8eefc; --bot: #ffffff;
    --warn-bg: #fff6e0; --warn: #8a5a00; --err-bg: #fdecec; --err: #a12626; --ok: #1f7a46;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1a1e26; --text: #e6e9ef; --muted: #98a1b3; --line: #2b313d;
      --accent: #6d8ff0; --accent-text: #0e1220; --user: #22304f; --bot: #1f242e;
      --warn-bg: #3a2f14; --warn: #f0c060; --err-bg: #3d1d1d; --err: #ff9a9a; --ok: #5fd08f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
  .app { max-width: 920px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-top: 10px; }
  label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
  select, input[type=text] { font: inherit; color: var(--text); background: var(--bg);
         border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  button { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px;
           background: var(--panel); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .who { font-size: 12px; color: var(--muted); margin-left: auto; }
  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 82%; padding: 10px 13px; border-radius: 12px; border: 1px solid var(--line);
         white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.bot { align-self: flex-start; background: var(--bot); }
  .msg.err { align-self: flex-start; background: var(--err-bg); color: var(--err); }
  .meta { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; font-size: 11.5px; color: var(--muted); }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
  .chip.ok { color: var(--ok); }
  .chip.bad { color: var(--err); }
  .wait { align-self: flex-start; background: var(--warn-bg); color: var(--warn);
          padding: 8px 12px; border-radius: 12px; font-size: 13.5px; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 8px; }
  .examples button { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; }
  form { display: flex; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--line);
         background: var(--panel); position: sticky; bottom: 0; }
  form input { flex: 1; font-size: 15px; padding: 10px 12px; }
  .tbl-wrap { margin-top: 8px; overflow-x: auto; white-space: normal; }
  .tbl-title { font-weight: 600; font-size: 13.5px; margin: 4px 0 6px; }
  table.data { border-collapse: collapse; font-size: 13.5px; min-width: 100%; }
  table.data th, table.data td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
  table.data th { background: var(--bg); font-weight: 600; white-space: nowrap; }
  table.data td.num, table.data th.num { text-align: right; white-space: nowrap; }
  table.data tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--bg) 45%, transparent); }
  .tbl-note { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .empty { color: var(--muted); text-align: center; margin-top: 40px; font-size: 14px; }
  @media (max-width: 560px) { .msg { max-width: 94%; } .who { margin-left: 0; width: 100%; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Business Agent Chat <span class="sub">(TEST)</span></h1>
    <div class="sub">Local Ollama model + InvenLogic ERP reader. TEST database ka data; har jawab me CPU par 2&ndash;8 minute lag sakte hain.</div>
    <div class="bar">
      <label>User (role)
        <select id="persona">
          <option value="owner">Owner &mdash; sales + customers + stock</option>
          <option value="sales">Sales &mdash; sales + customers</option>
          <option value="stock">Stock &mdash; stock only</option>
          <option value="member">Member &mdash; no business access</option>
        </select>
      </label>
      <label>Company id (tenant)
        <input id="company" type="text" value="900000001" size="12" inputmode="numeric">
      </label>
      <button id="newchat" type="button">Naya chat</button>
      <span class="who" id="who">Not signed in</span>
    </div>
  </header>
  <main id="log"><div class="empty" id="empty">Neeche ek sawaal likhiye, ya koi udaharan chuniye.</div></main>
  <div class="examples" id="examples"></div>
  <form id="form">
    <input id="text" type="text" autocomplete="off" maxlength="4000" placeholder="Jaise: Aaj ki total sales kitni hai?">
    <button class="primary" id="send" type="submit">Bhejo</button>
  </form>
</div>
<script>
(() => {
  const EXAMPLES = [
    "Aaj ki total sales kitni hai?",
    "Kal ki sales batao",
    "Is mahine ki sales kitni hai?",
    "Is saal ki sales pichhle saal se compare karo",
    "Low stock products kaunse hain?",
    "Main Godown mein kya stock hai?",
    "Sabhi customers ke overdue bills dikhao",
    "Mere paas kitne customers hain?",
    "Aaj kitne customer aaye?",
  ];
  const $ = (id) => document.getElementById(id);
  const log = $("log"), text = $("text"), send = $("send");
  let session = null, threadId = null, busy = false;

  for (const q of EXAMPLES) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = q;
    b.onclick = () => { text.value = q; text.focus(); };
    $("examples").appendChild(b);
  }

  function tableEl(t) {
    const wrap = document.createElement("div");
    wrap.className = "tbl-wrap";
    const title = document.createElement("div");
    title.className = "tbl-title";
    title.textContent = t.title + " (" + t.rows.length + ")";
    wrap.appendChild(title);
    const table = document.createElement("table");
    table.className = "data";
    const numeric = t.columns.map((_, i) => t.rows.every((r) => /^-?₹?[\d.,]+(\s|$)/.test(r[i] || "")));
    const head = table.createTHead().insertRow();
    t.columns.forEach((c, i) => {
      const th = document.createElement("th");
      th.textContent = c; if (numeric[i]) th.className = "num";
      head.appendChild(th);
    });
    const tbody = table.createTBody();
    for (const r of t.rows) {
      const tr = tbody.insertRow();
      r.forEach((v, i) => { const td = tr.insertCell(); td.textContent = v; if (numeric[i]) td.className = "num"; });
    }
    wrap.appendChild(table);
    if (t.truncated) {
      const note = document.createElement("div");
      note.className = "tbl-note"; note.textContent = "List adhoori hai (incomplete).";
      wrap.appendChild(note);
    }
    return wrap;
  }

  function add(kind, body, chips, tables) {
    const empty = $("empty"); if (empty) empty.remove();
    const div = document.createElement("div");
    div.className = "msg " + kind;
    div.textContent = body;
    for (const t of tables || []) div.appendChild(tableEl(t));
    if (chips && chips.length) {
      const meta = document.createElement("div");
      meta.className = "meta";
      for (const [label, cls] of chips) {
        const c = document.createElement("span");
        c.className = "chip " + (cls || ""); c.textContent = label;
        meta.appendChild(c);
      }
      div.appendChild(meta);
    }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  async function signIn() {
    const company = $("company").value.trim();
    const res = await fetch("/chat/session", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({persona: $("persona").value, company_id: company}),
    });
    if (!res.ok) throw new Error("Sign-in failed (" + res.status + "): company id sirf digits hona chahiye.");
    session = await res.json();
    $("who").textContent = session.user_id + " | roles: " + session.roles.join(", ") +
                           " | company " + session.tenant_id;
  }

  function reset() {
    session = null; threadId = null;
    log.innerHTML = '<div class="empty" id="empty">Naya chat. Ek sawaal likhiye.</div>';
    $("who").textContent = "Not signed in";
  }
  $("newchat").onclick = reset;
  $("persona").onchange = reset;
  $("company").onchange = reset;

  $("form").onsubmit = async (event) => {
    event.preventDefault();
    const message = text.value.trim();
    if (!message || busy) return;
    busy = true; send.disabled = true; text.value = "";
    add("user", message);
    const wait = document.createElement("div");
    wait.className = "wait"; log.appendChild(wait);
    const started = Date.now();
    const tick = () => {
      const s = Math.round((Date.now() - started) / 1000);
      wait.textContent = "Agent soch raha hai... " + Math.floor(s / 60) + "m " + (s % 60) + "s";
    };
    tick(); const timer = setInterval(tick, 1000);
    log.scrollTop = log.scrollHeight;
    try {
      if (!session) await signIn();
      const body = {message};
      if (threadId) body.thread_id = threadId;
      const post = () => fetch("/api/v1/agent/turn", {
        method: "POST",
        headers: {"Content-Type": "application/json", "Authorization": "Bearer " + session.token},
        body: JSON.stringify(body),
      });
      let res = await post();
      if (res.status === 401) {  // the server restarted: its token key changed
        await signIn();
        res = await post();
      }
      const data = await res.json().catch(() => ({}));
      if (data.error && !data.thread_id) {
        add("err", (data.error.message || "Error") + " [" + (data.error.code || res.status) + "]");
      } else {
        threadId = data.thread_id || threadId;
        const chips = (data.tool_calls || []).map(
          (c) => [c.tool_name + ": " + c.status + (c.error_code ? " (" + c.error_code + ")" : ""),
                  c.status === "ok" ? "ok" : "bad"]);
        chips.push([data.status + " | " + Math.round((data.duration_ms || 0) / 1000) + "s", ""]);
        if (data.error) chips.push([data.error.code, "bad"]);
        const tables = data.tables || [];
        let msg = data.message || "(no message)";
        // The table shows the rows; drop the same list from the text.
        if (tables.length) {
          msg = msg.replace(/\s*(Details|Overdue invoices): (?!\d+\.(\s|$))[\s\S]*$/, (cut) => cut.includes("(TEST data") ? " (TEST data, not real company data.)" : "").trim() || msg;
        }
        add(data.status === "failed" ? "err" : "bot", msg, chips, tables);
      }
    } catch (err) {
      add("err", String(err.message || err));
    } finally {
      clearInterval(timer); wait.remove();
      busy = false; send.disabled = false; text.focus();
    }
  };
})();
</script>
</body>
</html>
