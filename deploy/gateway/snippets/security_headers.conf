# Security headers for a JSON-only API (Phase 8, ADR-054). Included at server level and
# again in every location that sets its own add_header (nginx does not inherit them then).

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# JSON only: nothing may be loaded or framed. (Breaks the interactive /docs page, which is
# off in production; staging with API_DOCS_ENABLED=true needs a relaxed policy there.)
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
# Responses carry user data: never cache them in shared or browser caches.
add_header Cache-Control "no-store" always;
