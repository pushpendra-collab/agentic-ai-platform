# Forwarding to the API (Phase 8, ADR-054). Included by every proxied location.

proxy_pass http://agentic_api;
proxy_http_version 1.1;
proxy_set_header Connection "";

# The gateway is the edge: it REPLACES client-supplied forwarding headers instead of
# appending to them, so a client cannot inject an address or scheme. The API applies
# them only from the gateway's address (API_FORWARDED_ALLOW_IPS).
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Real-IP "";
proxy_set_header Forwarded "";
# The gateway's request id reaches the API as X-Request-ID, which the API logs as
# client_request_id next to its own server-generated id (ADR-045): one grep joins
# gateway and API logs. The API never adopts it as its own id.
proxy_set_header X-Request-ID $request_id;

# Authorization is forwarded unchanged (nginx forwards request headers by default) and
# never logged (gateway_json log format).

# Phase 15 (ADR-064): the API sends safe defaults for these two itself (for deployments
# without this gateway); here the gateway's own values (security_headers.conf) are the
# only ones, so clients never receive duplicates.
proxy_hide_header Cache-Control;
proxy_hide_header X-Content-Type-Options;

proxy_connect_timeout 5s;
# JSON responses are small: buffer them (frees the API connection early). The API has no
# streaming endpoint (ADR-043: turns are synchronous). A future SSE location must add
# `proxy_buffering off;` and a read timeout longer than its heartbeat interval.
proxy_buffering on;
proxy_request_buffering on;
# Only connection errors/timeouts move a request to another replica, and never for POST
# or PATCH (nginx does not retry non-idempotent methods without `non_idempotent`):
# an agent turn is never sent twice by the gateway.
proxy_next_upstream error timeout;
proxy_next_upstream_tries 2;
