# Local development infrastructure. Not for production use as-is.
#
#   docker compose up -d postgres redis                    # infrastructure only (as before)
#   docker compose --profile app up -d                     # + migrate job, API, maintenance worker
#   docker compose --profile idp-test up -d keycloak       # reference OIDC provider (verification)
#   sh deploy/gateway/dev-certs.sh                          # once: self-signed dev certificate
#   docker compose --profile app --profile gateway up -d   # + TLS gateway on https://localhost:8443
#
# Never run `docker compose down -v`: it deletes the pgdata volume (all local data).
# `docker compose down` (without -v), `stop` and image rebuilds keep the database.
#
# Container hardening for the application roles (Phase 15, ADR-064): read-only root
# filesystem (tmpfs /tmp), no Linux capabilities, no privilege escalation, an init process
# as PID 1. The same settings are verified end to end by deploy/smoke/run_smoke.py.
x-app-hardening: &app-hardening
  read_only: true
  tmpfs:
    - /tmp:size=64m
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  init: true

# Creates two databases on one PostgreSQL 16 server:
#   agentic       - application database
#   agentic_test  - integration-test database (dropped and recreated freely)
# and two roles (see docker/postgres/init/01-roles.sh):
#   agentic_owner - owns the schema; used only for migrations
#   agentic_app   - runtime role: data access (DML) only, no DDL
services:
  postgres:
    # PostgreSQL 16 + pgvector (semantic/episodic memory, ADR-034). Same Debian
    # base as the official postgres:16 image, so existing volumes stay compatible.
    image: pgvector/pgvector:pg16-trixie
    container_name: agentic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentic
      POSTGRES_USER: agentic_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-agentic_owner_dev}
      APP_DB_USER: agentic_app
      APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD:-agentic_app_dev}
      TEST_DB_NAME: agentic_test
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic_owner -d agentic"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Redis: ephemeral data only (cache, temporary state, locks, idempotency
  # fast-path). No persistence: losing it loses nothing that matters (ADR-007).
  # noeviction: when full, writes fail loudly instead of silently evicting locks.
  redis:
    image: redis:7-alpine
    container_name: agentic-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-agentic_redis_dev}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-agentic_redis_dev}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-agentic_redis_dev}

  # --- Application (Phase 7, ADR-050). Opt-in: docker compose --profile app up -d ---------
  # One image, three roles. Runs against the postgres/redis services above (the same
  # database and volume: nothing here creates, resets or replaces data). Local/staging
  # shape only: production runs the same image on its orchestrator with managed
  # PostgreSQL/Redis and secrets from a secret manager (ARCHITECTURE.md § A.11).
  migrate:
    profiles: ["app"]
    build: .
    image: agentic-platform:local
    <<: *app-hardening
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Schema-owner role: only this one-shot job gets it.
      DATABASE_MIGRATION_URL: postgresql://agentic_owner:${POSTGRES_OWNER_PASSWORD:-agentic_owner_dev}@postgres:5432/agentic
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    image: agentic-platform:local
    <<: *app-hardening
    restart: unless-stopped
    env_file:
      - path: .env  # LLM key, AUTH_* (optional file; never committed)
        required: false
    environment: &app-env
      APP_ENV: ${APP_ENV:-development}
      LOG_FORMAT: json
      # Runtime role only (DML, RLS-bound); never the owner.
      DATABASE_URL: postgresql://agentic_app:${POSTGRES_APP_PASSWORD:-agentic_app_dev}@postgres:5432/agentic
      DATABASE_MIGRATION_URL: ""
      REDIS_URL: redis://:${REDIS_PASSWORD:-agentic_redis_dev}@redis:6379/0
      API_RUN_MAINTENANCE: "false"
      # Phase 8: trust X-Forwarded-* from the gateway only (compose network range).
      API_FORWARDED_ALLOW_IPS: ${API_FORWARDED_ALLOW_IPS:-127.0.0.1}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-}
      # Phase 15: no ERP unless explicitly configured (and production also needs a
      # VERIFIED contract, Phase 14). `fake` = TEST data, development only.
      ERP_ADAPTER: ${ERP_ADAPTER:-none}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  maintenance:
    profiles: ["app"]
    image: agentic-platform:local
    <<: *app-hardening
    command: ["python", "-m", "agentic_platform.maintenance", "--loop"]
    restart: unless-stopped
    stop_grace_period: 60s  # SIGTERM: the batch in progress commits, then the worker exits
    env_file:
      - path: .env
        required: false
    environment: *app-env
    healthcheck:
      disable: true  # no HTTP port; observed through logs and maintenance.run audit rows
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # --- Reference OIDC provider for verification only (Phase 7) ----------------------------
  # docker compose --profile idp-test up -d keycloak; then tests/live/test_oidc_live.py.
  # Keycloak in dev mode with a throw-away admin password: NOT a production identity
  # provider and NOT the provider selection (PROJECT_STATUS Q6 is still open).
  keycloak:
    profiles: ["idp-test"]
    image: quay.io/keycloak/keycloak:26.4
    container_name: agentic-keycloak-test
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-keycloak_admin_dev}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"

  # --- TLS gateway (Phase 8, ADR-054). Opt-in: docker compose --profile app --profile gateway --
  # Unprivileged nginx (uid 101): TLS, redirect, security headers, size/time limits and
  # per-address rate limits in front of `api`. Authentication stays in the API. Needs a
  # certificate in deploy/gateway/certs (dev: deploy/gateway/dev-certs.sh; never committed).
  gateway:
    profiles: ["gateway"]
    image: nginxinc/nginx-unprivileged:1.27.5-alpine  # >= 1.27.3: `server ... resolve`
    container_name: agentic-gateway
    restart: unless-stopped
    environment:
      GATEWAY_UPSTREAM: api:8000
      GATEWAY_RESOLVER: 127.0.0.11  # Docker's embedded DNS
      GATEWAY_SERVER_NAME: ${GATEWAY_SERVER_NAME:-localhost}
      GATEWAY_HTTPS_PORT: ${GATEWAY_HTTPS_PORT:-8443}
      GATEWAY_REQUESTS_PER_SECOND: ${GATEWAY_REQUESTS_PER_SECOND:-20}
      GATEWAY_BURST: ${GATEWAY_BURST:-40}
      GATEWAY_TURNS_PER_MINUTE: ${GATEWAY_TURNS_PER_MINUTE:-30}
      GATEWAY_MAX_CONNECTIONS_PER_IP: ${GATEWAY_MAX_CONNECTIONS_PER_IP:-20}
      GATEWAY_TURN_TIMEOUT_SECONDS: ${GATEWAY_TURN_TIMEOUT_SECONDS:-300}
      GATEWAY_INTERNAL_CIDR: ${GATEWAY_INTERNAL_CIDR:-172.16.0.0/12}
      # Render only GATEWAY_* (nginx's own $variables stay untouched).
      NGINX_ENVSUBST_FILTER: GATEWAY_
    volumes:
      - ./deploy/gateway/templates:/etc/nginx/templates:ro
      - ./deploy/gateway/snippets:/etc/nginx/snippets:ro
      - ./deploy/gateway/certs:/etc/nginx/certs:ro
    ports:
      - "${GATEWAY_HTTPS_PORT:-8443}:8443"
      - "${GATEWAY_HTTP_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/gateway-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
