[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-platform"
version = "0.1.0"
description = "Agentic AI platform foundation: LangGraph agent runtime, PostgreSQL data layer, Redis ephemeral layer and HTTP API. No business domains yet."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",
    "anthropic>=1.11,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "tzdata>=2024.1",  # IANA timezone data; Windows has no system tz database
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.13,<2",
    "redis>=5.2,<9",  # redis-py (pure Python; hiredis not used: blocked DLLs, ADR-030)
    "fastapi>=0.115,<1",  # HTTP API (Phase 6, ADR-043)
    "uvicorn>=0.30,<1",  # ASGI server; plain install (no compiled extras)
    "httpx>=0.27,<1",  # OIDC key fetch; FastAPI test client
]

[project.optional-dependencies]
# OIDC/JWT identity provider (AUTH_PROVIDER=oidc). Needs the compiled `cryptography`
# wheel; development tokens do not.
oidc = [
    "PyJWT[crypto]>=2.8,<3",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "PyJWT[crypto]>=2.8,<3",
]

[project.scripts]
agentic-platform = "agentic_platform.__main__:main"
agentic-platform-api = "agentic_platform.api.__main__:main"
agentic-platform-maintenance = "agentic_platform.maintenance.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_platform = [
    "prompts/templates/*.md",
    "api/static/*.html",
    "db/migrations/script.py.mako",
    "db/migrations/versions/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "postgres: needs a real PostgreSQL (set TEST_DATABASE_URL); skipped otherwise",
    "redis: needs a real Redis (set TEST_REDIS_URL); skipped otherwise",
    "live_oidc: needs a real OIDC provider (LIVE_KEYCLOAK_* or LIVE_OIDC_*); skipped otherwise",
    "live_llm: calls the real LLM provider (RUN_LIVE_LLM_TESTS=1 + credentials); skipped otherwise",
]
filterwarnings = [
    # Emitted by a transitive `requests` import inside langchain-core; unrelated to this project.
    "ignore::Warning:requests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["agentic_platform"]
plugins = ["pydantic.mypy"]
exclude = ["db/migrations/versions/"]
