# Alembic configuration. The database URL is NOT stored here: env.py reads
# DATABASE_MIGRATION_URL (schema-owner role), falling back to DATABASE_URL.
#
#   alembic upgrade head          # apply all migrations
#   alembic downgrade -1          # roll back one migration
#   alembic revision -m "msg"     # new empty migration (autogenerate: add --autogenerate)
#   alembic upgrade head --sql    # print SQL for DBA review without connecting

[alembic]
script_location = agentic_platform.db:migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
